[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noisycricket"
version = "2.3.0"
description = "noisyCricket — privacy noise generator with optional Tor/onion mode, a local dashboard, and community relay contribution"
requires-python = ">=3.10"
dependencies = [
  "requests[socks]>=2.31",
  "PyYAML>=6.0",
]

[project.scripts]
cricket = "noisycricket.cli:main"
cricket-launch = "noisycricket.launcher:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["noisycricket*"]

[tool.setuptools.package-data]
noisycricket = ["web/*.html"]
