[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noisycricket"
version = "2.1.0"
description = "noisyCricket v2 — conversation-driven web-noise generator with Tor/clearnet split and community relay contribution"
requires-python = ">=3.10"
dependencies = [
  "requests[socks]>=2.31",
  "PyYAML>=6.0",
]

[project.scripts]
cricket = "noisycricket.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["noisycricket*"]
