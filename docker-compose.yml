# docker compose up -d   →   docker compose logs noisycricket   (shows the dashboard link)
services:
  noisycricket:
    build: .
    image: noisycricket
    container_name: noisycricket
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"     # dashboard: this machine only. Keep both sides 8765.
    volumes:
      - noisycricket-data:/data   # settings and Tor state
    shm_size: "1gb"               # Chromium needs more shared memory than Docker's default
    environment:
      TZ: "Etc/UTC"               # set yours (e.g. America/New_York): noise follows local hours

volumes:
  noisycricket-data: {}
