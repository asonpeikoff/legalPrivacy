name: Build & Release Executables

on:
  push:
    tags:
      - 'v*'          # trigger on any version tag, e.g. v2.2.0
  workflow_dispatch:     # or start it by hand (Actions tab / API) with a version; it creates the tag
    inputs:
      tag:
        description: "Release tag to create, e.g. v2.8.0"
        required: true

permissions:
  contents: write   # needed to create releases and upload assets

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: legalprivacy-launch-linux
            rename: legalprivacy-launch-linux
          - os: windows-latest
            artifact: legalprivacy-launch.exe
            rename: legalprivacy-launch-windows.exe
          - os: macos-latest
            artifact: legalprivacy-launch
            rename: legalprivacy-launch-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller
          python run_tests.py

      - name: Build executable
        run: pyinstaller legalprivacy.spec --clean --noconfirm

      - name: Rename artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: mv dist/legalprivacy-launch dist/${{ matrix.rename }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item dist\legalprivacy-launch.exe dist\${{ matrix.rename }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rename }}
          path: dist/${{ matrix.rename }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Make Linux/macOS binaries executable
        run: |
          chmod +x dist/legalprivacy-launch-linux/legalprivacy-launch-linux || true
          chmod +x dist/legalprivacy-launch-macos/legalprivacy-launch-macos || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: "legalPrivacy ${{ github.event.inputs.tag || github.ref_name }}"
          body: |
            ## ⚖️ legalPrivacy ${{ github.event.inputs.tag || github.ref_name }}

            Believable background browsing, searches and DNS lookups, so bulk analysis of your traffic tells much less about you.

            ### Download and run (nothing to install)

            | Platform | File | How to run |
            |---|---|---|
            | Windows | `legalprivacy-launch-windows.exe` | Double-click. If SmartScreen warns, choose **More info → Run anyway**. |
            | macOS | `legalprivacy-launch-macos` | Right-click → **Open** the first time (the app isn't signed). |
            | Linux | `legalprivacy-launch-linux` | `chmod +x legalprivacy-launch-linux && ./legalprivacy-launch-linux` |

            Your browser opens the dashboard, you answer three quick questions, and it starts. A real Chrome, Edge,
            Brave or Chromium on the computer makes the browsing look human; Tor is optional and set up for you.

            Or from source: `pip install git+https://github.com/asonpeikoff/noisyCricket` then `legalprivacy-launch`.

            ### What's new
            See the [changelog](https://github.com/asonpeikoff/noisyCricket/blob/master/CHANGELOG.md).
          files: |
            dist/legalprivacy-launch-linux/legalprivacy-launch-linux
            dist/legalprivacy-launch-windows.exe/legalprivacy-launch-windows.exe
            dist/legalprivacy-launch-macos/legalprivacy-launch-macos
          draft: false
          prerelease: false
